			shellScript = "set -e\n\n# Bundle unar and lsar for CBR support (no Homebrew required at runtime).\n# IMPORTANT: these must be copied into $BUILT_PRODUCTS_DIR/ComicArc.app \u2014 the actual build\n# product that gets archived/installed \u2014 not only into the app/ dev convenience copy below.\n# This used to only try Homebrew paths (/opt/homebrew/bin, /usr/local/bin) and only wrote\n# into app/, so a real Release build on a machine without Homebrew's unar/lsar installed \u2014\n# or Xcode's own DerivedData output, which is what actually ships \u2014 silently never had CBR\n# support at all, despite the docs and code claiming it was always bundled. Vendored copies\n# in Vendor/unar/ (tracked in git) remove the dependency on the local machine's state.\nfor TOOL in unar lsar; do\n  cp -f \"$SRCROOT/Vendor/unar/$TOOL\" \"$BUILT_PRODUCTS_DIR/ComicArc.app/Contents/MacOS/$TOOL\"\n  chmod 755 \"$BUILT_PRODUCTS_DIR/ComicArc.app/Contents/MacOS/$TOOL\"\ndone\n\n# Skip deep codesign when xctest bundles are embedded (test/build-for-testing builds) \u2014\n# adding files after Xcode's own signing pass invalidates the seal, so re-sign here.\nif ! ls \"$BUILT_PRODUCTS_DIR/ComicArc.app/Contents/PlugIns\"/*.xctest >/dev/null 2>&1; then\n  codesign --force --deep --sign - \"$BUILT_PRODUCTS_DIR/ComicArc.app\"\nfi\n\nAPP_DEST=\"$SRCROOT/app/ComicArc.app\"\nrm -rf \"$APP_DEST\"\ncp -R \"$BUILT_PRODUCTS_DIR/ComicArc.app\" \"$APP_DEST\"\n";
